version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      platforms:
        - linux/arm64
    container_name: money_tracker_backend
    ports:
      - "5555:5555"
    volumes:
      - .:/app
    environment:
      - GIN_MODE=release
    restart: unless-stopped

networks:
    host:
      external: true